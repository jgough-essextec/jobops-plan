- id: S10.5
  title: Notion Kanban board for the job pipeline
  pts: 3
  deps: [S10.1, S10.3]
  story: As Doc, I want a Kanban board of my job pipeline in Notion, where dragging a card moves the job, so that I can see and steer the whole search at a glance from my phone.
  context: "A Board view on the JobOps Notion database, grouped by Stage. Columns: Discovered, Evaluated, Hold, Shortlisted, Tailoring, In Review, Ready for Doc, Approved, Applied, Interviewing, Offer, Rejected (Archived and Screened-out hidden). Cards show company, role, grade, score, next action, and the age of the item in its stage. The view is set up from code (Notion API) so it can be rebuilt. Dragging changes the Stage property; the poller from S10.1 treats a Stage change as a command from Doc. Board rules (`board_rules.yaml`) derive the legal drag moves from the state machine: only moves where actor=doc is allowed, e.g. Hold→Shortlisted, Ready for Doc→Approved or →Tailoring (revise), Approved→Applied, any→Archived. Illegal drags snap back with a comment explaining why. This module is shared with S10.8."
  ac:
    - Board view exists with the columns above, in that order, and can be recreated by `jobops notion setup-board`
    - A legal drag moves the job in the ledger as actor doc within one poll (≤ 60s)
    - An illegal drag is reverted with a comment naming the allowed moves
    - "Optional swimlanes: Hold, Escalated and Needs-your-look appear as a filtered 'My queue' board"
  tasks:
    - t: Board rules derived from the state machine
      red: ["test_board_rules.py — every rule maps to a transitions.yaml edge with actor=doc; no rule allows an agent-only edge; generated rules equal checked-in board_rules.yaml"]
      green: board_rules.py generator + board_rules.yaml
    - t: Board view setup from code
      red: ["test_notion_board_setup.py — against the Notion stub, setup creates a board view grouped by Stage with columns in order and hidden groups; second run makes no changes"]
      green: notion_sync/board.py + CLI command
    - t: Drag-to-move via the poller
      red: ["test_notion_drag.py — Stage changed Hold→Shortlisted → ledger SHORTLISTED actor=doc source=notion_board; Stage changed Evaluated→Applied → reverted + comment"]
      green: Stage-change handling in the S10.1 poller, using board_rules
    - t: Card properties and My queue board
      red: ["test_notion_cards.py — card payload snapshot (company, role, grade, next action, days in stage); My queue filter returns only HOLD/ESCALATED/needs_doc_look"]
      green: projection additions + second view
  tests:
    - [component, "Given a job in HOLD, When Doc drags it to Shortlisted, Then ledger SHORTLISTED with actor=doc within one poll"]
    - [component, "Given a job in Evaluated, When dragged to Applied, Then Stage reverts and a comment lists allowed moves"]
    - [guardrail, "Given an agent integration token, When it changes Stage in Notion, Then the poller ignores it (only Doc's Notion user counts as doc)"]
    - [unit, "Given transitions.yaml changes, When board rules regenerate, Then CI fails if board_rules.yaml is stale"]
    - [component, "Given the board view was deleted in Notion, When setup-board runs, Then it is recreated identically"]
  dod: ["Screenshot of the board on phone attached to PR", "docs/boards.md explains allowed drags"]
  risks: "Notion reports edits by user, so 'is this Doc?' depends on Doc's Notion user id being configured; tested as a guardrail."

- id: S10.6
  title: "Spike: can Paperclip's Board view drag and drop?"
  pts: 2
  deps: [S04.1, S04.6]
  story: As the builder, I want to know whether Paperclip's own Board view supports dragging issues between status columns, and how it can be extended, so that we choose between configuring Paperclip (S10.7) and building our own board (S10.8).
  context: "Paperclip's docs describe a Board view on the Issues page with card density, cold-lane mode and column page size, but they describe changing status through a Properties picker and do not mention dragging. They also list a Plugin SDK. Timebox: 1 day on the pinned Paperclip version. Check: drag between status columns on desktop and phone browsers; whether drags respect checkout locks (an agent holding an issue); whether columns can be custom (e.g. by label stage:*) or only status; whether a plugin can add a page or view; which API calls a status change makes."
  ac:
    - ADR-9 records the answer (Path A configure Paperclip, or Path B build our own) with evidence (screen recording + captured API calls)
    - The unused story (S10.7 or S10.8) is marked Won't do with a link to ADR-9
  tasks:
    - t: Exercise the Board view on the pinned version
      red: ["spike/test_board_status_change.py — records the API call made when status changes from the UI; fails until a fixture is captured"]
      green: Manual exploration on desktop + phone; capture fixtures/paperclip/board_*.json
    - t: Check the plugin SDK for custom views
      red: ["spike/test_plugin_hello.py — a hello-world plugin page loads in the Paperclip UI (fails if the SDK can't add pages)"]
      green: Minimal plugin, or a documented 'not possible'
    - t: Write ADR-9
      red: ["docs lint requires ADR-9 sections Context/Decision/Consequences and a Path field (A or B)"]
      green: docs/adr/0009-agent-work-board.md
  tests:
    - [contract, "Given a status change made from the Board view, When captured, Then the request matches PATCH /api/issues/{id} with status"]
    - [contract, "Given an issue checked out by an agent, When Doc drags it, Then the recorded behavior (allowed / refused / lock released) is documented"]
    - [unit, "Given ADR-9, When parsed, Then Path is A or B"]
  dod: ["Decision reviewed with Doc"]
  risks: Paperclip ships often; re-check at each Paperclip upgrade.

- id: S10.7
  title: "Path A: configure Paperclip's Board as the agent-work board"
  pts: 2
  deps: [S10.6, S10.3]
  condition: Only if ADR-9 chooses Path A (Paperclip's Board view supports drag and drop).
  story: As Doc, I want Paperclip's own Board view set up as a parallel board of the agents' work so that I can watch and nudge what each agent is doing without leaving Paperclip.
  context: "Columns are Paperclip issue statuses (backlog, todo, in_progress, in_review, blocked, done, cancelled). Saved board per project (Discovery, Applications, Inbox) and a 'Needs Doc' board filtered by label. Issue labels (stage:*, tier:*, agent:*) from S04.6 make cards readable. Status changes Doc makes on the board are mirrored: a webhook/poller maps meaningful moves to commands (e.g., blocked→todo = retry; any→cancelled on a job issue = Skip via the S10.3 command service), so the ledger stays the source of truth."
  ac:
    - Saved boards exist per project and are recreated by company-as-code apply where Paperclip supports it, or documented as one-time setup where it does not
    - Doc's moves that have a pipeline meaning reach the ledger through the S10.3 command service; others only change the issue
  tasks:
    - t: Board configuration
      red: ["test_paperclip_board_config.py — apply produces the saved views/labels expected (or the setup checklist is validated if views are UI-only)"]
      green: company.yaml additions or docs/boards.md checklist
    - t: Mirror meaningful moves
      red: ["test_paperclip_board_mirror.py — fixture: issue moved to cancelled by doc → Skip command; moved by an agent → ignored"]
      green: Status-change poller using board_rules
  tests:
    - [integration, "Given Doc drags an [EVALUATE] issue from blocked to todo, When mirrored, Then the Manager retries it"]
    - [guardrail, "Given an agent changes an issue's status, When mirrored, Then no doc command is issued"]
  dod: ["docs/boards.md updated"]
  risks: None beyond S10.6.

- id: S10.8
  title: "Path B: JobOps Board web app (React + dnd-kit)"
  pts: 8
  deps: [S10.6, S10.3, S10.5]
  condition: Only if ADR-9 chooses Path B (no drag and drop in Paperclip's Board view).
  story: As Doc, I want a drag-and-drop Kanban web app over Paperclip and the ledger so that I get a true parallel board for the agents' work and my pipeline, usable from my phone.
  context: "A small React + TypeScript app (Vite) in services/board_ui, using @dnd-kit/core + @dnd-kit/sortable. dnd-kit is chosen over Pragmatic drag and drop because dnd-kit uses pointer/touch sensors (Doc drives this from a phone) and has a ready sortable preset; Pragmatic, which builds on the browser's native drag API, stays the fallback if performance becomes a problem. Two modes: Pipeline (columns = ledger stages; same board_rules as S10.5; drops call the S10.3 command service as actor doc) and Agent work (columns = Paperclip issue statuses, swimlanes per agent; drops PATCH /api/issues/{id} status via a thin backend that holds the Paperclip board key). Backend: a small FastAPI 'board-api' that reads from the ledger + Paperclip REST, enforces board_rules, and pushes updates by server-sent events. Served only on the tailnet, with a Doc-only session token. If the S10.6 spike found the Plugin SDK can host a page, the app is packaged as a Paperclip plugin page instead of a separate site."
  ac:
    - Both modes render from live data and update within 5s of a change made elsewhere (Notion, Telegram, agents)
    - Legal drops take effect; illegal drops snap back with the reason; drops on issues checked out by an agent are refused
    - Works on mobile Safari/Chrome with touch drag; keyboard drag works (accessibility)
    - Never exposes an action that agents can't already be refused (no 'submit', no 'send')
  tasks:
    - t: board-api backend
      red: ["test_board_api.py — GET /board?mode=pipeline returns columns from ledger; GET ?mode=work returns Paperclip issues grouped by status and agent (fixtures); POST /move enforces board_rules; unauthenticated → 401"]
      green: services/board_api (FastAPI) + SSE endpoint
    - t: Pipeline mode UI with dnd-kit
      red: ["board.pipeline.test.tsx — renders columns in order; simulated drag Hold→Shortlisted calls /move; rejected move snaps back and shows reason toast"]
      green: React components (Board, Column, Card) with DndContext + SortableContext, multi-container collision detection
    - t: Agent-work mode UI
      red: ["board.work.test.tsx — swimlanes per agent; drop on a checked-out issue shows 'agent is working on this' and no PATCH sent"]
      green: Work mode + lock indicator from live-run data
    - t: Mobile, keyboard and live updates
      red: ["Playwright e2e (mobile viewport, touch) drags a card; keyboard sensor test moves a card with Space/arrow keys; SSE update re-renders a card moved in Notion"]
      green: TouchSensor + KeyboardSensor config, SSE client
    - t: Packaging and access
      red: ["test_board_access.py — app reachable on tailnet hostname only; token required; container healthcheck"]
      green: Dockerfile, compose service, optional Paperclip plugin wrapper per ADR-9
  tests:
    - [component, "Given pipeline mode, When Doc drags Ready for Doc → Approved, Then the S10.3 approve command runs and Notion + Telegram reflect it"]
    - [component, "Given work mode, When Doc drags a blocked [TAILOR] issue to todo, Then Paperclip issue status becomes todo and the Manager picks it up next sweep"]
    - [guardrail, "Given an issue checked out by an agent, When dropped elsewhere, Then no status change is sent"]
    - [guardrail, "Given a request without Doc's session token, When POST /move, Then 401 and nothing changes"]
    - [e2e, "Given a phone-sized viewport, When a card is touch-dragged between columns, Then the move succeeds"]
    - [unit, "Given the same board_rules as S10.5, When compared, Then Notion and the web board allow exactly the same moves"]
  dod: ["Lighthouse accessibility score ≥ 90", "docs/boards.md covers both boards"]
  risks: "Two boards can disagree for a few seconds; the ledger wins and both re-sync from it."
