  dod: []
  risks: None.

- id: S12.4
  title: Pilot week and tuning
  pts: 3
  deps: [S12.2, S12.3]
  story: As Doc, I want a live pilot measured against the success metrics so that I can decide to rely on JobOps.
  context: Shadow off, real Notion/Telegram, real inbox. Daily metrics. End-of-week review — metrics vs PLAN §1, remediation backlog.
