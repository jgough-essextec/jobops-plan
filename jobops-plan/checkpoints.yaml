# Human checkpoints for the JobOps build.
# before = the agent cannot START the story until Doc clears it (credentials, labels, hardware).
# after  = the agent can build it, but it stays waiting_on_doc until Doc reviews and clears it.
# Only Doc runs:  python plan/tools/build_state.py clear <story>

- id: S00.2
  when: after
  ask: Review the career-ops spike findings and accept ADR-3 (bridge vs. Hermes-skill split).
- id: S00.3
  when: after
  ask: Review the Paperclip + hermes_local spike and accept ADR-6 and ADR-7.
- id: S00.4
  when: before
  ask: OK live JobSpy scraping from the sandbox (small volumes) and say which sites to enable.
- id: S00.5
  when: before
  ask: Give the build sandbox a Tailscale auth key (tagged, ephemeral) and LiteLLM per-agent virtual keys for the mock + one real route.
- id: S04.3
  when: after
  ask: Review paperclip/company.yaml (agents, reporting lines, budgets, heartbeats).
- id: S05.2
  when: after
  ask: Review routing policy.yaml (tiers, watchlist, red flags, daily cap).
- id: S06.4
  when: before
  ask: Label the 40-JD Scout golden set with your expected tier (about 1 hour).
- id: S08.1
  when: after
  ask: Review the Critic rubric.yaml.
- id: S09.1
  when: before
  ask: Create the Gmail OAuth client (gmail.readonly + gmail.compose + gmail.labels only) and store the refresh token in sops.
- id: S10.1
  when: before
  ask: Create the Notion integration, share the JobOps database with it, and provide the token and your Notion user id.
- id: S10.2
  when: before
  ask: Create the Telegram bot with BotFather and provide the token and your chat id.
- id: S10.6
  when: after
  ask: Accept ADR-9 (Paperclip board path A or custom dnd-kit board path B). Then mark the other story wont-do.
- id: S12.2
  when: before
  ask: Put your real master CV and profile.yml in the private profile/ mount (never in the repo), then approve the 7-day shadow run with real models (test Telegram chat, sandbox Notion DB).
- id: S12.4
  when: before
  ask: Approve go-live for the pilot week (real inbox label, real Notion, real Telegram).
